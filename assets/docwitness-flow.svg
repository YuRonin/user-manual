  <text x="44" y="81" fill="#a6bdd5" font-family="Arial, sans-serif" font-size="15">DocWitness workflow · 流程示意，非产品截图</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(44 112)">
